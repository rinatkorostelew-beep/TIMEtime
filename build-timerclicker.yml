          package com.mushka.timerclicker;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.ServiceInfo;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.graphics.PixelFormat;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Build;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;
          import android.os.PowerManager;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.util.Locale;

          public class TimerService extends Service {
              static volatile TimerService inst;

              private final Handler h = new Handler(Looper.getMainLooper());
              private Cfg cfg;
              private WindowManager wm;
              private LinearLayout panel;
              private WindowManager.LayoutParams panelLp;
              private TextView tStatus;
              private TextView bGo;
              private View ovl;
              private volatile boolean armed;
              private volatile int tapsDone;
              private volatile String result = "";
              private volatile long targetMs;
              private Thread worker;
              private PowerManager.WakeLock wl;

              @Override
              public IBinder onBind(Intent in) {
                  return null;
              }

              @Override
              public int onStartCommand(Intent in, int flags, int startId) {
                  if (in == null || "STOP".equals(in.getAction())) {
                      stopSelf();
                      return START_NOT_STICKY;
                  }
                  if (inst != null) {
                      return START_NOT_STICKY;
                  }
                  cfg = new Cfg(this);
                  startFg();
                  wm = (WindowManager) getSystemService(WINDOW_SERVICE);
                  showPanel();
                  inst = this;
                  h.post(ticker);
                  return START_NOT_STICKY;
              }

              private void startFg() {
                  NotificationManager nm = (NotificationManager) getSystemService(NOTIFICATION_SERVICE);
                  nm.createNotificationChannel(new NotificationChannel("tc", "Тайм-кликер", NotificationManager.IMPORTANCE_LOW));
                  Intent stop = new Intent(this, TimerService.class).setAction("STOP");
                  PendingIntent pi = PendingIntent.getService(this, 1, stop, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
                  Notification n = new Notification.Builder(this, "tc")
                          .setSmallIcon(android.R.drawable.ic_menu_recent_history)
                          .setContentTitle("Тайм-кликер работает")
                          .setContentText("Нажми «Остановить», чтобы выключить")
                          .addAction(new Notification.Action.Builder(android.R.drawable.ic_menu_close_clear_cancel, "Остановить", pi).build())
                          .setOngoing(true)
                          .build();
                  if (Build.VERSION.SDK_INT >= 34) {
                      startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE);
                  } else {
                      startForeground(1, n);
                  }
              }

              private int dp(int v) {
                  return (int) (v * getResources().getDisplayMetrics().density + 0.5f);
              }

              private void toast(String s) {
                  Toast.makeText(this, s, Toast.LENGTH_SHORT).show();
              }

              private WindowManager.LayoutParams params(int w, int hh, boolean keepOn) {
                  int flags = WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                          | WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL
                          | WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN
                          | WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS;
                  if (keepOn) {
                      flags |= WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON;
                  }
                  WindowManager.LayoutParams lp = new WindowManager.LayoutParams(w, hh,
                          WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY, flags, PixelFormat.TRANSLUCENT);
                  lp.gravity = Gravity.TOP | Gravity.START;
                  if (Build.VERSION.SDK_INT >= 30) {
                      lp.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_ALWAYS;
                  } else if (Build.VERSION.SDK_INT >= 28) {
                      lp.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                  }
                  return lp;
              }

              // ---------- панель ----------
              private TextView btn(String text) {
                  TextView t = new TextView(this);
                  t.setText(text);
                  t.setTextColor(Color.WHITE);
                  t.setTextSize(14);
                  t.setPadding(dp(10), dp(8), dp(10), dp(8));
                  return t;
              }

              private void showPanel() {
                  panel = new LinearLayout(this);
                  panel.setOrientation(LinearLayout.HORIZONTAL);
                  panel.setGravity(Gravity.CENTER_VERTICAL);
                  panel.setPadding(dp(6), dp(4), dp(6), dp(4));
                  GradientDrawable g = new GradientDrawable();
                  g.setColor(0xEE171A2C);
                  g.setCornerRadius(dp(22));
                  g.setStroke(dp(1), 0x556C8CFF);
                  panel.setBackground(g);

                  TextView handle = btn("≡");
                  tStatus = btn("");
                  tStatus.setMinWidth(dp(120));
                  TextView bPoint = btn("Точка");
                  bGo = btn("Старт");
                  TextView bX = btn("✕");
                  panel.addView(handle);
                  panel.addView(tStatus);
                  panel.addView(bPoint);
                  panel.addView(bGo);
                  panel.addView(bX);

                  bPoint.setOnClickListener(v -> startPoint());
                  bGo.setOnClickListener(v -> {
                      if (armed) {
                          cancel();
                      } else {
                          arm();
                      }
                  });
                  bX.setOnClickListener(v -> stopSelf());

                  panelLp = params(WindowManager.LayoutParams.WRAP_CONTENT, WindowManager.LayoutParams.WRAP_CONTENT, true);
                  panelLp.x = dp(12);
                  panelLp.y = dp(80);
                  handle.setOnTouchListener(new View.OnTouchListener() {
                      float dx;
                      float dy;

                      @Override
                      public boolean onTouch(View v, MotionEvent e) {
                          switch (e.getAction()) {
                              case MotionEvent.ACTION_DOWN:
                                  dx = e.getRawX() - panelLp.x;
                                  dy = e.getRawY() - panelLp.y;
                                  return true;
                              case MotionEvent.ACTION_MOVE:
                                  panelLp.x = (int) (e.getRawX() - dx);
                                  panelLp.y = (int) (e.getRawY() - dy);
                                  wm.updateViewLayout(panel, panelLp);
                                  return true;
                              default:
                                  return true;
                          }
                      }
                  });
                  wm.addView(panel, panelLp);
              }

              private final Runnable ticker = new Runnable() {
                  @Override
                  public void run() {
                      if (inst == null) {
                          return;
                      }
                      long now = cfg.now();
                      if (armed) {
                          tStatus.setText("до нажатия " + TimeUtil.countdown(targetMs - now));
                      } else if (!result.isEmpty()) {
                          tStatus.setText(result);
                      } else {
                          tStatus.setText("Пекин " + TimeUtil.time(now));
                      }
                      bGo.setText(armed ? "Стоп" : "Старт");
                      h.postDelayed(this, 100);
                  }
              };

              // ---------- отсчёт и нажатие ----------
              private void arm() {
                  if (armed) {
                      return;
                  }
                  if (TapService.inst == null) {
                      toast("Включи службу доступности «Тайм-кликер»");
                      return;
                  }
                  if (!cfg.hasPoint()) {
                      toast("Сначала выбери кнопку: «Точка»");
                      return;
                  }
                  long tg;
                  try {
                      tg = cfg.target();
                  } catch (Exception e) {
                      toast("Неверная дата или время");
                      return;
                  }
                  if (tg - cfg.now() < 300) {
                      toast("Это время уже прошло");
                      return;
                  }
                  targetMs = tg;
                  final long target = tg;
                  armed = true;
                  tapsDone = 0;
                  result = "";
                  PowerManager pm = (PowerManager) getSystemService(POWER_SERVICE);
                  wl = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "tc:timer");
                  wl.acquire(Math.max(60000L, target - cfg.now() + 120000L));
                  worker = new Thread(new Runnable() {
                      @Override
                      public void run() {
                          runSchedule(target);
                      }
                  }, "tc-timer");
                  worker.start();
              }

              private void cancel() {
                  armed = false;
                  if (worker != null) {
                      worker.interrupt();
                  }
                  releaseWl();
                  result = "";
              }

              private synchronized void releaseWl() {
                  if (wl != null && wl.isHeld()) {
                      wl.release();
                  }
                  wl = null;
              }

              private void runSchedule(long target) {
                  try {
                      long off = cfg.offset();
                      long fireAt = target - cfg.lead();
                      boolean resynced = false;
                      while (armed) {
                          long wait = fireAt - (System.currentTimeMillis() + off);
                          if (wait <= 0) {
                              break;
                          }
                          if (!resynced && wait < 25000 && wait > 8000) {
                              resynced = true;
                              long o = Ntp.sync();
                              if (o != Ntp.FAIL) {
                                  cfg.setOffset(o);
                                  off = o;
                              }
                              continue;
                          }
                          if (wait > 200) {
                              Thread.sleep(Math.min(wait - 150, 250));
                          } else if (wait > 20) {
                              Thread.sleep(1);
                          } else {
                              Thread.yield();
                          }
                      }
                      if (!armed) {
                          return;
                      }
                      int n = cfg.count();
                      int gap = cfg.gap();
                      int x = cfg.x();
                      int y = cfg.y();
                      long first = 0;
                      for (int i = 0; i < n && armed; i++) {
                          TapService.tap(x, y);
                          if (i == 0) {
                              first = System.currentTimeMillis() + off;
                          }
                          tapsDone++;
                          if (i < n - 1) {
                              pause(gap);
                          }
                      }
                      result = String.format(Locale.US, "нажато %d, первое %+d мс", tapsDone, first - target);
                  } catch (InterruptedException ignored) {
                      return;
                  } finally {
                      armed = false;
                      releaseWl();
                  }
              }

              private void pause(int ms) throws InterruptedException {
                  long end = System.nanoTime() + ms * 1000000L;
                  while (armed) {
                      long left = end - System.nanoTime();
                      if (left <= 0) {
                          return;
                      }
                      if (left > 3000000L) {
                          Thread.sleep(1);
                      } else {
                          Thread.yield();
                      }
                  }
              }

              // ---------- выбор кнопки ----------
              private void startPoint() {
                  if (armed) {
                      toast("Сначала останови отсчёт");
                      return;
                  }
                  if (ovl != null) {
                      return;
                  }
                  panel.setVisibility(View.INVISIBLE);
                  PointView v = new PointView(this);
                  ovl = v;
                  wm.addView(v, params(WindowManager.LayoutParams.MATCH_PARENT, WindowManager.LayoutParams.MATCH_PARENT, true));
              }

              private void endPoint(boolean ok, int x, int y) {
                  wm.removeView(ovl);
                  ovl = null;
                  panel.setVisibility(View.VISIBLE);
                  if (ok) {
                      cfg.setPoint(x, y);
                      toast("Точка сохранена: " + x + ", " + y);
                  }
              }

              private class PointView extends View {
                  final Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
                  float px;
                  float py;
                  boolean has;

                  PointView(Context c) {
                      super(c);
                      p.setTextSize(dp(15));
                  }

                  @Override
                  protected void onDraw(Canvas c) {
                      int[] o = new int[2];
                      getLocationOnScreen(o);
                      int w = getWidth();
                      int hh = getHeight();
                      int bh = dp(64);
                      p.setStyle(Paint.Style.FILL);
                      p.setColor(0x33000000);
                      c.drawRect(0, 0, w, hh, p);
                      p.setColor(0xCC000000);
                      c.drawRect(0, 0, w, dp(40), p);
                      p.setColor(Color.WHITE);
                      c.drawText("Коснись кнопки, на которую нужно нажимать", dp(12), dp(26), p);
                      p.setColor(0xEE171A2C);
                      c.drawRect(0, hh - bh, w, hh, p);
                      p.setColor(Color.WHITE);
                      c.drawText("Отмена", dp(24), hh - bh / 2f + dp(5), p);
                      if (!has) {
                          return;
                      }
                      float vx = px - o[0];
                      float vy = py - o[1];
                      p.setStyle(Paint.Style.STROKE);
                      p.setStrokeWidth(dp(2));
                      p.setColor(0xFFFF3B5C);
                      c.drawCircle(vx, vy, dp(18), p);
                      c.drawLine(vx - dp(28), vy, vx + dp(28), vy, p);
                      c.drawLine(vx, vy - dp(28), vx, vy + dp(28), p);
                      p.setStyle(Paint.Style.FILL);
                      p.setColor(0xFF4C6FFF);
                      c.drawRect(w / 2f, hh - bh, w, hh, p);
                      p.setColor(Color.WHITE);
                      c.drawText("Выбрать (" + (int) px + ", " + (int) py + ")", w / 2f + dp(16), hh - bh / 2f + dp(5), p);
                  }

                  @Override
                  public boolean onTouchEvent(MotionEvent e) {
                      boolean inBtn = e.getY() > getHeight() - dp(64);
                      switch (e.getAction()) {
                          case MotionEvent.ACTION_DOWN:
                          case MotionEvent.ACTION_MOVE:
                              if (!inBtn) {
                                  px = e.getRawX();
                                  py = e.getRawY();
                                  has = true;
                                  invalidate();
                              }
                              return true;
                          case MotionEvent.ACTION_UP:
                              if (inBtn) {
                                  if (e.getX() < getWidth() / 2f) {
                                      endPoint(false, 0, 0);
                                  } else if (has) {
                                      endPoint(true, (int) px, (int) py);
                                  }
                              }
                              return true;
                          default:
                              return true;
                      }
                  }
              }

              @Override
              public void onDestroy() {
                  inst = null;
                  cancel();
                  h.removeCallbacksAndMessages(null);
                  try {
                      if (ovl != null && ovl.getParent() != null) {
                          wm.removeView(ovl);
                      }
                  } catch (Exception ignored) {
                  }
                  try {
                      if (panel != null) {
                          wm.removeView(panel);
                      }
                  } catch (Exception ignored) {
                  }
                  super.onDestroy();
              }
          }
          FILE_10_END
          mkdir -p app/src/main/java/com/mushka/timerclicker
          cat > app/src/main/java/com/mushka/timerclicker/Ui.java <<'FILE_11_END'
          package com.mushka.timerclicker;

          import android.content.Context;
          import android.graphics.Color;
          import android.view.View;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          final class Ui {
              static final int BG = 0xFF0E1020;

              private Ui() {
              }

              static int dp(Context c, int v) {
                  return (int) (v * c.getResources().getDisplayMetrics().density + 0.5f);
              }

              static TextView text(Context c, String s, int sp) {
                  TextView t = new TextView(c);
                  t.setText(s);
                  t.setTextSize(sp);
                  t.setTextColor(Color.WHITE);
                  t.setPadding(0, dp(c, 6), 0, dp(c, 6));
                  return t;
              }

              static Button button(Context c, String s) {
                  Button b = new Button(c);
                  b.setText(s);
                  return b;
              }

              static LinearLayout column(Context c) {
                  LinearLayout l = new LinearLayout(c);
                  l.setOrientation(LinearLayout.VERTICAL);
                  int p = dp(c, 16);
                  l.setPadding(p, p, p, p);
                  return l;
              }

              static ScrollView scroll(Context c, View child) {
                  ScrollView s = new ScrollView(c);
                  s.setBackgroundColor(BG);
                  s.addView(child);
                  return s;
              }

              static boolean isLight(int col) {
                  return (Color.red(col) * 299 + Color.green(col) * 587 + Color.blue(col) * 114) / 1000 > 140;
              }
          }
          FILE_11_END
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_launcher.xml <<'FILE_12_END'
