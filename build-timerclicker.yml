          mkdir -p app/src/main/java/com/mushka/timerclicker
          cat > app/src/main/java/com/mushka/timerclicker/Cfg.java <<'FILE_5_END'
          package com.mushka.timerclicker;

          import android.content.Context;
          import android.content.SharedPreferences;

          import java.util.Date;

          public class Cfg {
              private final SharedPreferences p;

              public Cfg(Context c) {
                  p = c.getSharedPreferences("tc", Context.MODE_PRIVATE);
              }

              long offset() {
                  return p.getLong("off", 0);
              }

              void setOffset(long v) {
                  p.edit().putLong("off", v).apply();
              }

              /** Точное «сейчас» с учётом поправки часов. */
              long now() {
                  return System.currentTimeMillis() + offset();
              }

              String date() {
                  return p.getString("date", TimeUtil.date(now()));
              }

              String time() {
                  return p.getString("time", "10:00:00");
              }

              int ms() {
                  return p.getInt("ms", 0);
              }

              int count() {
                  return Math.max(1, p.getInt("n", 1));
              }

              int gap() {
                  return Math.max(1, p.getInt("gap", 100));
              }

              int lead() {
                  return Math.max(0, p.getInt("lead", 30));
              }

              boolean hasPoint() {
                  return p.contains("x") && p.contains("y");
              }

              int x() {
                  return p.getInt("x", 0);
              }

              int y() {
                  return p.getInt("y", 0);
              }

              void setPoint(int x, int y) {
                  p.edit().putInt("x", x).putInt("y", y).apply();
              }

              void setTarget(long ms) {
                  p.edit().putString("date", TimeUtil.date(ms)).putString("time", TimeUtil.time(ms))
                          .putInt("ms", (int) (ms % 1000)).apply();
              }

              void saveFields(String date, String time, int ms, int n, int gap, int lead) {
                  p.edit().putString("date", date).putString("time", time).putInt("ms", ms)
                          .putInt("n", n).putInt("gap", gap).putInt("lead", lead).apply();
              }

              long target() throws java.text.ParseException {
                  return TimeUtil.parse(date(), time(), ms());
              }
          }
          FILE_5_END
          mkdir -p app/src/main/java/com/mushka/timerclicker
          cat > app/src/main/java/com/mushka/timerclicker/MainActivity.java <<'FILE_6_END'
          package com.mushka.timerclicker;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.Settings;
          import android.text.InputType;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Toast;

          public class MainActivity extends Activity {
              private final Handler h = new Handler(Looper.getMainLooper());
              private Cfg cfg;
              private TextView clock;
              private TextView syncLabel;
              private TextView status;
              private EditText dateEt;
              private EditText timeEt;
              private EditText msEt;
              private EditText nEt;
              private EditText gapEt;
              private EditText leadEt;
              private boolean askedNotifications = false;
              private boolean ticking;

              private final Runnable tick = new Runnable() {
                  @Override
                  public void run() {
                      if (!ticking) {
                          return;
                      }
                      clock.setText("Пекин (UTC+8)\n" + TimeUtil.full(cfg.now()));
                      h.postDelayed(this, 50);
                  }
              };

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  cfg = new Cfg(this);
                  LinearLayout root = Ui.column(this);

                  root.addView(Ui.text(this, "Тайм-кликер (Пекин)", 26));
                  root.addView(Ui.text(this, "Нажимает на выбранную кнопку в точное время по Пекину.", 15));

                  clock = Ui.text(this, "", 20);
                  root.addView(clock);
                  syncLabel = Ui.text(this, "", 13);
                  root.addView(syncLabel);
                  Button sync = Ui.button(this, "Синхронизировать время (NTP)");
                  sync.setOnClickListener(v -> doSync());
                  root.addView(sync);

                  root.addView(Ui.text(this, "Когда нажать (по Пекину)", 17));
                  dateEt = field("Дата ГГГГ-ММ-ДД", cfg.date(), InputType.TYPE_CLASS_DATETIME);
                  timeEt = field("Время ЧЧ:ММ:СС", cfg.time(), InputType.TYPE_CLASS_DATETIME);
                  msEt = field("Миллисекунды (0-999)", String.valueOf(cfg.ms()), InputType.TYPE_CLASS_NUMBER);
                  root.addView(dateEt);
                  root.addView(timeEt);
                  root.addView(msEt);

                  LinearLayout quick = new LinearLayout(this);
                  quick.setOrientation(LinearLayout.HORIZONTAL);
                  Button m1 = Ui.button(this, "Через 1 мин");
                  m1.setOnClickListener(v -> setIn(60000));
                  Button m5 = Ui.button(this, "Через 5 мин");
                  m5.setOnClickListener(v -> setIn(300000));
                  quick.addView(m1);
                  quick.addView(m5);
                  root.addView(quick);

                  root.addView(Ui.text(this, "Нажатия", 17));
                  nEt = field("Сколько раз нажать", String.valueOf(cfg.count()), InputType.TYPE_CLASS_NUMBER);
                  gapEt = field("Пауза между нажатиями, мс", String.valueOf(cfg.gap()), InputType.TYPE_CLASS_NUMBER);
                  leadEt = field("Опережение, мс (нажать раньше на столько)", String.valueOf(cfg.lead()), InputType.TYPE_CLASS_NUMBER);
                  root.addView(nEt);
                  root.addView(gapEt);
                  root.addView(leadEt);

                  status = Ui.text(this, "", 14);
                  root.addView(status);

                  Button acc = Ui.button(this, "1. Включить службу доступности");
                  acc.setOnClickListener(v -> startActivity(new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)));
                  root.addView(acc);
                  root.addView(Ui.text(this, "Если переключатель серый: Настройки, Приложения, Тайм-кликер, значок ⋮, «Разрешить ограниченные настройки».", 13));

                  Button go = Ui.button(this, "2. Запустить панель");
                  go.setOnClickListener(v -> startPanel());
                  root.addView(go);

                  root.addView(Ui.text(this, "Порядок: 1) задай время и нажми «Запустить панель»; 2) открой нужное приложение на нужной странице; 3) на панели нажми «Точка» и коснись кнопки; 4) нажми «Старт». Экран должен оставаться включённым и разблокированным. Проверь настройку заранее кнопкой «Через 1 мин»: панель покажет, на сколько мс первое нажатие отличилось от цели. Это значение подскажет, какое «Опережение» поставить.", 14));
                  setContentView(Ui.scroll(this, root));
              }

              private EditText field(String hint, String value, int type) {
                  EditText e = new EditText(this);
                  e.setHint(hint);
                  e.setHintTextColor(0xFF777777);
                  e.setTextColor(0xFFFFFFFF);
                  e.setInputType(type);
                  e.setText(value);
                  return e;
              }

              private int num(EditText e, int def) {
                  try {
                      return Integer.parseInt(e.getText().toString().trim());
                  } catch (Exception ex) {
                      return def;
                  }
              }

              private void setIn(long ms) {
                  long t = cfg.now() + ms;
                  cfg.setTarget(t - t % 1000);
                  dateEt.setText(cfg.date());
                  timeEt.setText(cfg.time());
                  msEt.setText("0");
              }

              private void saveFields() {
                  cfg.saveFields(dateEt.getText().toString().trim(), timeEt.getText().toString().trim(),
                          Math.max(0, Math.min(999, num(msEt, 0))), Math.max(1, num(nEt, 1)),
                          Math.max(1, num(gapEt, 100)), Math.max(0, num(leadEt, 30)));
              }

              private void doSync() {
                  syncLabel.setText("Синхронизация...");
                  new Thread(() -> {
                      final long o = Ntp.sync();
                      runOnUiThread(() -> {
                          if (o == Ntp.FAIL) {
                              syncLabel.setText("Не удалось связаться с серверами времени. Проверь интернет.");
                          } else {
                              cfg.setOffset(o);
                              showSync();
                          }
                      });
                  }).start();
              }

              private void showSync() {
                  syncLabel.setText("Часы телефона " + (cfg.offset() >= 0 ? "отстают" : "спешат") + " на "
                          + Math.abs(cfg.offset()) + " мс" + (Ntp.lastHost.isEmpty() ? "" : " (сервер " + Ntp.lastHost + ")")
                          + ". Поправка применена.");
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  ticking = true;
                  h.post(tick);
                  showSync();
                  status.setText("Служба доступности: " + (TapService.inst != null ? "включена" : "выключена")
                          + "\nПоверх других окон: " + (Settings.canDrawOverlays(this) ? "разрешено" : "не разрешено")
                          + "\nПанель: " + (TimerService.inst != null ? "запущена" : "не запущена")
                          + "\nКнопка: " + (cfg.hasPoint() ? cfg.x() + ", " + cfg.y() : "не выбрана"));
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  ticking = false;
                  saveFields();
              }

              private void startPanel() {
                  saveFields();
                  try {
                      long t = cfg.target();
                      if (t < cfg.now()) {
                          Toast.makeText(this, "Указанное время уже прошло, поставь новое", Toast.LENGTH_LONG).show();
                      }
                  } catch (Exception e) {
                      Toast.makeText(this, "Неверная дата или время. Формат: 2026-10-12 и 10:00:00", Toast.LENGTH_LONG).show();
                      return;
                  }
                  if (TapService.inst == null) {
                      Toast.makeText(this, "Сначала включи службу доступности «Тайм-кликер»", Toast.LENGTH_LONG).show();
                      startActivity(new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS));
                      return;
                  }
                  if (!Settings.canDrawOverlays(this)) {
                      Toast.makeText(this, "Разреши показ поверх других окон, вернись и нажми «Запустить панель» снова", Toast.LENGTH_LONG).show();
                      startActivity(new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + getPackageName())));
                      return;
                  }
                  if (Build.VERSION.SDK_INT >= 33 && !askedNotifications
                          && checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                      askedNotifications = true;
                      requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS}, 7);
                      return;
                  }
                  startForegroundService(new Intent(this, TimerService.class));
                  moveTaskToBack(true);
              }

              @Override
              public void onRequestPermissionsResult(int code, String[] perms, int[] results) {
                  super.onRequestPermissionsResult(code, perms, results);
                  startPanel();
              }
          }
          FILE_6_END
