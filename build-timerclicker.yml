          package com.mushka.timerclicker;

          import java.text.ParseException;
          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.Locale;
          import java.util.TimeZone;

          /** Время по Пекину (Asia/Shanghai, UTC+8, без перехода на летнее время). */
          final class TimeUtil {
              static final TimeZone BJ = TimeZone.getTimeZone("Asia/Shanghai");

              private TimeUtil() {
              }

              static SimpleDateFormat fmt(String pattern) {
                  SimpleDateFormat f = new SimpleDateFormat(pattern, Locale.US);
                  f.setTimeZone(BJ);
                  return f;
              }

              static String full(long ms) {
                  return fmt("yyyy-MM-dd HH:mm:ss.SSS").format(new Date(ms));
              }

              static String date(long ms) {
                  return fmt("yyyy-MM-dd").format(new Date(ms));
              }

              static String time(long ms) {
                  return fmt("HH:mm:ss").format(new Date(ms));
              }

              static long parse(String date, String time, int ms) throws ParseException {
                  SimpleDateFormat f = fmt("yyyy-MM-dd HH:mm:ss");
                  f.setLenient(false);
                  return f.parse(date.trim() + " " + time.trim()).getTime() + ms;
              }

              static String countdown(long left) {
                  if (left < 0) {
                      left = 0;
                  }
                  long totalSec = left / 1000;
                  long h = totalSec / 3600;
                  long m = (totalSec % 3600) / 60;
                  long s = totalSec % 60;
                  long tenth = (left % 1000) / 100;
                  if (h > 0) {
                      return String.format(Locale.US, "%d:%02d:%02d", h, m, s);
                  }
                  return String.format(Locale.US, "%02d:%02d.%d", m, s, tenth);
              }
          }
          FILE_9_END
