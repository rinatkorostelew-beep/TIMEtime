              <path
                  android:fillColor="#4C6FFF"
                  android:pathData="M54,54m-30,0a30,30 0,1 1,60 0a30,30 0,1 1,-60 0" />
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M51,32h6v24l14,8l-3,5l-17,-10z" />
          </vector>
          FILE_12_END
          mkdir -p app/src/main/res/values
