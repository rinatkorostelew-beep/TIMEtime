          package com.mushka.timerclicker;

          import java.net.DatagramPacket;
          import java.net.DatagramSocket;
          import java.net.InetAddress;

          /** Простой SNTP-клиент: считает, насколько часы телефона отстают от точного времени. */
          final class Ntp {
              static final long FAIL = Long.MIN_VALUE;
              static volatile String lastHost = "";
              private static final String[] HOSTS = {"ntp.aliyun.com", "cn.pool.ntp.org", "time.windows.com", "pool.ntp.org"};

              private Ntp() {
              }

              /** Возвращает поправку в мс (точное время минус время телефона) или FAIL. */
              static long sync() {
                  for (String host : HOSTS) {
                      try {
                          long off = query(host, 123, 1500);
                          lastHost = host;
                          return off;
                      } catch (Exception ignored) {
                      }
                  }
                  return FAIL;
              }

              static long query(String host, int port, int timeoutMs) throws Exception {
                  byte[] buf = new byte[48];
                  buf[0] = 0x1B;
                  DatagramSocket s = new DatagramSocket();
                  try {
                      s.setSoTimeout(timeoutMs);
                      InetAddress a = InetAddress.getByName(host);
                      long t0 = System.currentTimeMillis();
                      s.send(new DatagramPacket(buf, buf.length, a, port));
                      DatagramPacket r = new DatagramPacket(buf, buf.length);
                      s.receive(r);
                      long t3 = System.currentTimeMillis();
                      long t1 = stamp(buf, 32);
                      long t2 = stamp(buf, 40);
                      if (t1 <= 0 || t2 <= 0) {
                          throw new Exception("empty reply");
                      }
                      long off = ((t1 - t0) + (t2 - t3)) / 2;
                      if (Math.abs(off) > 86400000L) {
                          throw new Exception("bad offset");
                      }
                      return off;
                  } finally {
                      s.close();
                  }
              }

              static long stamp(byte[] b, int o) {
                  long sec = 0;
                  long frac = 0;
                  for (int i = 0; i < 4; i++) {
                      sec = (sec << 8) | (b[o + i] & 0xFF);
                  }
                  for (int i = 4; i < 8; i++) {
                      frac = (frac << 8) | (b[o + i] & 0xFF);
                  }
                  if (sec == 0) {
                      return 0;
                  }
                  return (sec - 2208988800L) * 1000L + ((frac * 1000L) >> 32);
              }
          }
          FILE_7_END
